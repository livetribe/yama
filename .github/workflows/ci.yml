on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master
      - v2
  workflow_dispatch:
name: CI
jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.21.x, 1.x ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: test
        run: go test -v -race -timeout 10s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.21.x
          cache: true
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
      - name: Linting
        run: golangci-lint run

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version: 1.21.x
          cache: true
      - name: Calc coverage
        run: go test -v -covermode=count -coverprofile=coverage.out -timeout 10s ./...
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
