on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master
      - v2
  workflow_dispatch:
name: CI
jobs:
  test:
    strategy:
      matrix:
        go-version: [ 1.25.x, 1.x ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Warm build cache
        run: |
          go build -race ./...
          go tool wire --help
      - name: test
        run: go test -v -race -timeout 5m ./...

  check-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - name: Check formatting
        run: make check-fmt

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - name: Linting
        run: make lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
      - name: Calc coverage
        run: make coverage
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
